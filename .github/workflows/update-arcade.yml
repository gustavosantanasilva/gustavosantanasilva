name: 🕹️ Update Gustavo's GitHub Arcade

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update Arcade data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python github-arcade/scripts/update_arcade.py

      - name: Generate animated Pac-Man
        run: |
          python -m pip install pillow
          python github-arcade/scripts/generate_animation.py

      - name: Generate contribution visual
        run: python github-arcade/scripts/generate_snake.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md github-arcade/
          git diff --cached --quiet || git commit -m "chore: update GitHub Arcade"
          git push
