<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Gustavo Santos - Full Stack Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.45" stop-color="#151a33"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="mesh1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="orbCore" cx="0.35" cy="0.35" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#a5b4fc"/>
      <stop offset="0.65" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </radialGradient>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orbGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cardClip"><rect x="32" y="26" width="836" height="308" rx="24"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="900" height="360" rx="28" fill="url(#bgGrad)"/>

  <!-- moving mesh blobs -->
  <g>
    <circle cx="120" cy="80" r="180" fill="url(#mesh1)">
      <animate attributeName="cx" values="90;180;90" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;-10;60" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="300" r="200" fill="url(#mesh2)">
      <animate attributeName="cx" values="800;680;800" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="320;260;320" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="180" r="160" fill="url(#mesh3)">
      <animate attributeName="cx" values="430;520;430" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;220;160" dur="17s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- dot grid (perspective floor) -->
  <g fill="#ffffff" opacity="0.14">
    <g>
      <circle cx="40" cy="330" r="1.2"/><circle cx="90" cy="330" r="1.2"/><circle cx="140" cy="330" r="1.2"/><circle cx="190" cy="330" r="1.2"/><circle cx="240" cy="330" r="1.2"/><circle cx="290" cy="330" r="1.2"/><circle cx="340" cy="330" r="1.2"/><circle cx="390" cy="330" r="1.2"/><circle cx="440" cy="330" r="1.2"/><circle cx="490" cy="330" r="1.2"/><circle cx="540" cy="330" r="1.2"/><circle cx="590" cy="330" r="1.2"/><circle cx="640" cy="330" r="1.2"/><circle cx="690" cy="330" r="1.2"/><circle cx="740" cy="330" r="1.2"/><circle cx="790" cy="330" r="1.2"/><circle cx="840" cy="330" r="1.2"/><circle cx="870" cy="330" r="1.2"/>
      <circle cx="60" cy="352" r="1.6"/><circle cx="140" cy="352" r="1.6"/><circle cx="220" cy="352" r="1.6"/><circle cx="300" cy="352" r="1.6"/><circle cx="380" cy="352" r="1.6"/><circle cx="460" cy="352" r="1.6"/><circle cx="540" cy="352" r="1.6"/><circle cx="620" cy="352" r="1.6"/><circle cx="700" cy="352" r="1.6"/><circle cx="780" cy="352" r="1.6"/><circle cx="860" cy="352" r="1.6"/>
    </g>
  </g>

  <!-- floating particles -->
  <g fill="#ffffff">
    <circle cx="70" cy="100" r="1.6" opacity="0.7"><animate attributeName="cy" values="110;70;110" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.1;0.7" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="70" r="1.4" opacity="0.6"><animate attributeName="cy" values="80;40;80" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0.1;0.6" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="300" r="1.8" opacity="0.6"><animate attributeName="cy" values="310;270;310" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0.15;0.6" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="40" r="1.3" opacity="0.5"><animate attributeName="cy" values="50;20;50" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.1;0.5" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="140" r="1.5" opacity="0.6"><animate attributeName="cy" values="150;110;150" dur="8.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0.1;0.6" dur="8.5s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="330" r="1.5" opacity="0.5"><animate attributeName="cy" values="340;310;340" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.1;0.5" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- glass card -->
  <g clip-path="url(#cardClip)">
    <rect x="32" y="26" width="836" height="308" rx="24" fill="url(#glass)"/>
    <!-- shimmer sweep -->
    <rect x="32" y="26" width="836" height="308" fill="url(#cardEdge)"/>
    <g opacity="0.5">
      <polygon points="-120,0 60,0 -40,380 -220,380" fill="#ffffff" fill-opacity="0.05">
        <animateTransform attributeName="transform" type="translate" values="-120,0;900,0" dur="7s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <line x1="32" y1="26" x2="868" y2="26" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  </g>
  <rect x="32" y="26" width="836" height="308" rx="24" fill="none" stroke="url(#cardEdge)" stroke-width="1.5"/>

  <!-- ===== LEFT: 3D ORB ===== -->
  <g>
    <circle cx="150" cy="180" r="88" fill="#6366f1" opacity="0.25" filter="url(#orbGlow)">
      <animate attributeName="r" values="86;96;86" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.15;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- background circle -->
    <circle cx="150" cy="180" r="52" fill="#4338ca"/>
    <!-- core sphere with 3D shading -->
    <circle cx="150" cy="180" r="52" fill="url(#orbCore)"/>
    <!-- highlight -->
    <ellipse cx="132" cy="160" rx="24" ry="14" fill="#ffffff" opacity="0.5" transform="rotate(-24 132 160)">
      <animate attributeName="opacity" values="0.5;0.75;0.5" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <!-- orbiting ring 1 -->
    <ellipse cx="150" cy="180" rx="84" ry="26" fill="none" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="1.6" transform="rotate(-16 150 180)">
      <animateTransform attributeName="transform" type="rotate" from="-16 150 180" to="344 150 180" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <!-- satellite on ring -->
    <g>
      <circle cx="228" cy="168" r="4.5" fill="#67e8f9" filter="url(#glowSoft)"/>
      <animateTransform attributeName="transform" type="rotate" from="-16 150 180" to="344 150 180" dur="16s" repeatCount="indefinite"/>
    </g>
    <!-- orbiting ring 2 -->
    <ellipse cx="150" cy="180" rx="66" ry="72" fill="none" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2" transform="rotate(24 150 180)">
      <animateTransform attributeName="transform" type="rotate" from="24 150 180" to="384 150 180" dur="20s" repeatCount="indefinite"/>
    </ellipse>
    <!-- satellite on ring 2 -->
    <g>
      <circle cx="212" cy="146" r="3.5" fill="#d8b4fe" filter="url(#glowSoft)"/>
      <animateTransform attributeName="transform" type="rotate" from="24 150 180" to="384 150 180" dur="20s" repeatCount="indefinite"/>
    </g>
    <!-- code glyph -->
    <text x="150" y="190" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#ffffff" opacity="0.92">&lt;/&gt;</text>
  </g>

  <!-- ===== RIGHT: NAME + ROLE ===== -->
  <text x="240" y="158" font-family="'Inter', Arial, sans-serif" font-size="52" font-weight="800" fill="url(#nameGrad)" letter-spacing="0.5">Gustavo Santos</text>
  <text x="243" y="192" font-family="'Inter', Arial, sans-serif" font-size="19" font-weight="500" fill="#94a3b8">Full Stack Developer</text>

  <!-- glowing underline -->
  <line x1="243" y1="205" x2="243" y2="205" stroke="#67e8f9" stroke-width="2" stroke-linecap="round">
    <animate attributeName="x2" values="243;520;243" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/>
  </line>

  <!-- location + availability -->
  <g font-family="'Inter', Arial, sans-serif">
    <g>
      <path d="M243 232c0-5 4-8 8-8s8 3 8 8c0 4.4-8 14-8 14s-8-9.6-8-14z" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <circle cx="251" cy="232" r="2.2" fill="#64748b"/>
    </g>
    <text x="266" y="237" font-size="14" fill="#64748b">Brazil</text>
    <circle cx="385" cy="233" r="5" fill="#4ade80"><animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <text x="398" y="237" font-size="14" fill="#64748b">Available for opportunities</text>
  </g>

  <!-- tech chips -->
  <g font-family="'Inter', Arial, sans-serif" font-size="12.5">
    <g>
      <rect x="243" y="260" width="84" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#67e8f9" stroke-opacity="0.45"/>
      <text x="285" y="279" text-anchor="middle" font-weight="600" fill="#a5f3fc">Python</text>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="335" y="260" width="98" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#a5b4fc" stroke-opacity="0.45"/>
      <text x="384" y="279" text-anchor="middle" font-weight="600" fill="#c7d2fe">JavaScript</text>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="4.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="441" y="260" width="70" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#f0abfc" stroke-opacity="0.45"/>
      <text x="476" y="279" text-anchor="middle" font-weight="600" fill="#f5d0fe">PHP</text>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="3.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="519" y="260" width="82" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text x="560" y="279" text-anchor="middle" font-weight="600" fill="#a5f3fc">SQL</text>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="4.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="609" y="260" width="118" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#818cf8" stroke-opacity="0.45"/>
      <text x="668" y="279" text-anchor="middle" font-weight="600" fill="#c7d2fe">Git &amp; GitHub</text>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="4.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- bottom hint -->
  <text x="243" y="316" font-family="monospace" font-size="12" fill="#475569">&gt; building things · keep shipping · level up every day</text>
</svg>