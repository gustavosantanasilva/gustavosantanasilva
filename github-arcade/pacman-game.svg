<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Gustavo's Pac-Man GitHub Arcade">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#05050a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3557ff"/>
      <stop offset="1" stop-color="#6b7cff"/>
    </linearGradient>
    <radialGradient id="power" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#1e40af"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="track" d="M60 120 H 840" fill="none"/>
  </defs>

  <rect x="0" y="0" width="900" height="240" rx="18" fill="url(#bg)"/>
  <rect x="12" y="12" width="876" height="216" rx="12" fill="none" stroke="url(#wall)" stroke-width="4"/>

  <text x="30" y="42" fill="#ffe45c" font-family="monospace" font-size="20" font-weight="bold" filter="url(#glow)">
    PAC-MAN ARCADE
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="200" y="42" fill="#8d99ae" font-family="monospace" font-size="14">GUSTAVO SANTOS • 1UP</text>

  <text x="720" y="42" fill="#67e8f9" font-family="monospace" font-size="15">
    SCORE <tspan fill="#fff">000000</tspan>
  </text>

  <!-- TOP WALL -->
  <rect x="60" y="70" width="780" height="8" rx="4" fill="#3557ff"/>
  <!-- BOTTOM WALL -->
  <rect x="60" y="200" width="780" height="8" rx="4" fill="#3557ff"/>
  <!-- LEFT/RIGHT WALLS -->
  <rect x="60" y="70" width="8" height="138" rx="4" fill="#3557ff"/>
  <rect x="832" y="70" width="8" height="138" rx="4" fill="#3557ff"/>
  <!-- CENTER MAZE PIP -->
  <rect x="440" y="105" width="8" height="50" rx="4" fill="#3557ff"/>

  <!-- PELLETS ROW (top) -->
  <g>
    <circle cx="110" cy="122" r="3.5" fill="#ffe45c"><animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="122" r="3.5" fill="#ffe45c"><animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="122" r="3.5" fill="#ffe45c"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="122" r="3.5" fill="#ffe45c"><animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="122" r="3.5" fill="#ffe45c"><animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="490" cy="122" r="3.5" fill="#ffe45c"><animate attributeName="opacity" values="1;0.2;1" dur="1.05s" repeatCount="indefinite"/></circle>
    <circle cx="550" cy="122" r="3.5" fill="#ffe45c"><animate attributeName="opacity" values="1;0.2;1" dur="1.15s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="122" r="3.5" fill="#ffe45c"><animate attributeName="opacity" values="1;0.2;1" dur="0.95s" repeatCount="indefinite"/></circle>
    <circle cx="670" cy="122" r="3.5" fill="#ffe45c"><animate attributeName="opacity" values="1;0.2;1" dur="1.25s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="122" r="3.5" fill="#ffe45c"><animate attributeName="opacity" values="1;0.2;1" dur="1.08s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="122" r="3.5" fill="#ffe45c"><animate attributeName="opacity" values="1;0.2;1" dur="1.18s" repeatCount="indefinite"/></circle>
  </g>

  <!-- POWER-UP PELLET -->
  <circle cx="88" cy="122" r="10" fill="url(#power)" filter="url(#glow)">
    <animate attributeName="r" values="10;13;10" dur="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="812" cy="122" r="10" fill="url(#power)" filter="url(#glow)">
    <animate attributeName="r" values="10;13;10" dur="0.6s" repeatCount="indefinite"/>
  </circle>

  <!-- GHOSTS -->
  <g>
    <animateMotion dur="9s" repeatCount="indefinite" path="M120 122 H760" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"/>
    <rect x="-15" y="-14" width="30" height="26" rx="13" fill="#ff4d6d"/>
    <rect x="-15" y="-3" width="30" height="22" fill="#ff4d6d"/>
    <circle cx="-7" cy="-8" r="3.5" fill="#fff"/>
    <circle cx="7" cy="-8" r="3.5" fill="#fff"/>
    <circle cx="-6" cy="-8" r="1.6" fill="#1a1a2e"/>
    <circle cx="8" cy="-8" r="1.6" fill="#1a1a2e"/>
  </g>

  <!-- GHOST 2 -->
  <g>
    <animateMotion dur="12s" repeatCount="indefinite" path="M780 122 H140" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"/>
    <rect x="-15" y="-14" width="30" height="26" rx="13" fill="#61e7ff"/>
    <rect x="-15" y="-3" width="30" height="22" fill="#61e7ff"/>
    <circle cx="-7" cy="-8" r="3.5" fill="#fff"/>
    <circle cx="7" cy="-8" r="3.5" fill="#fff"/>
    <circle cx="-6" cy="-8" r="1.6" fill="#1a1a2e"/>
    <circle cx="8" cy="-8" r="1.6" fill="#1a1a2e"/>
  </g>

  <!-- PAC-MAN chasing -->
  <g>
    <animateMotion dur="7s" repeatCount="indefinite" path="M100 122 H800" rotate="0"/>
    <circle cx="0" cy="0" r="16" fill="#ffd21f"/>
    <path d="M0 0 L14 -10 A16 16 0 0 1 14 10 Z" fill="#05050a">
      <animate attributeName="d"
        values="M0 0 L14 -10 A16 16 0 0 1 14 10 Z;M0 0 L20 -2 A16 16 0 0 1 20 2 Z;M0 0 L14 -10 A16 16 0 0 1 14 10 Z"
        dur="0.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="2" cy="-7" r="2.5" fill="#111"/>
  </g>

  <!-- INSERT COIN -->
  <text x="330" y="235" fill="#4be3ac" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle" filter="url(#glow)">
    PRESS START • INSERT COIN
    <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
  </text>
</svg>
